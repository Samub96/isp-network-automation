---
# ========================================
# ISP Network Automation - Site Playbook
# ========================================

# Configuración base para todos los MikroTik
- name: Configuración base MikroTik
  hosts: core,distribuidores,transporte
  gather_facts: no
  roles:
    - interfaces
    - ospf_config

# Configuración específica para OLT
- name: Configuración OLT
  hosts: olt
  gather_facts: no
  roles:
    - olt_config

# Configuración específica para ONT
- name: Configuración ONT
  hosts: ont
  gather_facts: no
  roles:
    - ont_config
