# ========================================
# Global Ansible Configuration
# ========================================

# Credenciales MikroTik (usar ansible-vault en producción)
ansible_connection: network_cli
ansible_network_os: community.routeros.routeros
ansible_user: admin
ansible_password: admin
ansible_port: 22
ansible_command_timeout: 60

# Variables globales de red
core_subnet: "10.0.0.0/8"
loopback_subnet: "10.255.255.0/24"
management_subnet: "192.168.88.0/24"

# Configuración NTP (opcional)
ntp_servers:
  - "0.pool.ntp.org"
  - "1.pool.ntp.org"

# SNMP Configuration
snmp_community: "public"
snmp_version: "2c"
