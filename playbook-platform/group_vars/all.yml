ansible_connection: ssh
ansible_user: ubuntu
ansible_become: true
ansible_become_method: sudo

platform_timezone: America/Bogota
platform_domain: lab.local

servers_subnet: 10.10.10.0/24
core_subnet: 10.10.20.0/24
management_subnet: 10.10.30.0/24
radius_mgmt_subnet: 10.10.40.0/24
pppoe_clients_subnet: 100.64.0.0/18

ntp_servers:
  - 0.co.pool.ntp.org
  - 1.south-america.pool.ntp.org
  - 0.south-america.pool.ntp.org
  - 0.pool.ntp.org
  - 1.pool.ntp.org

dhcp_subnet_cidr: 10.10.30.0/24
dhcp_range_start: 10.10.30.100
dhcp_range_end: 10.10.30.200
dhcp_router: 10.10.30.1
dhcp_dns_servers:
  - 10.10.10.7

# Multi-scope DHCP pools aligned with the lab addressing plan.
dhcp_scopes:
  - subnet: 10.10.10.0/24
    range_start: 10.10.10.100
    range_end: 10.10.10.150
    router: 10.10.10.1
  - subnet: 10.10.20.0/24
    range_start: 10.10.20.10
    range_end: 10.10.20.200
    router: 10.10.20.1
  - subnet: 10.10.30.0/24
    range_start: 10.10.30.10
    range_end: 10.10.30.200
    router: 10.10.30.1
  - subnet: 10.10.40.0/24
    range_start: 10.10.40.10
    range_end: 10.10.40.200
    router: 10.10.40.1

dns_listen_interfaces:
  - lo
  - eth0
dns_forwarders:
  - 8.8.8.8
  - 8.8.4.4

dns_zone_name: lab.local
dns_local_records:
  - name: dns-01
    ip: 10.10.10.7
  - name: dhcp-01
    ip: 10.10.10.6
  - name: ntp-01
    ip: 10.10.10.9
  - name: radius-01
    ip: 10.10.10.2
  - name: zabbix-01
    ip: 10.10.10.4
  - name: web-01
    ip: 10.10.10.8
  - name: rtr-edge-1
    ip: 10.10.20.1
  - name: cr-core-1
    ip: 10.10.20.2
  - name: cr-core-2
    ip: 10.10.20.3
  - name: fw-edge-1
    ip: 10.10.30.1
  - name: sw-srv-1
    ip: 10.10.10.10
  - name: sw-srv-2
    ip: 10.10.10.11
  - name: sw-srv-3
    ip: 10.10.10.12
  - name: sw-srv-4
    ip: 10.10.10.13
  - name: rtr-torre-1
    ip: 10.10.20.5
  - name: olt-acc-1
    ip: 10.10.40.10

radius_clients:
  - name: core
    ip: 10.10.20.0/24
  - name: management
    ip: 10.10.30.0/24
  - name: mimosa-admin
    ip: 10.10.40.0/24

radius_secret: radiussecret

pppoe_service_profiles:
  - name: pppoe-100m
    speed: 100M
    description: Servicio residencial 100 megas
  - name: pppoe-200m
    speed: 200M
    description: Servicio residencial 200 megas
  - name: pppoe-500m
    speed: 500M
    description: Servicio residencial 500 megas

qos_priority_policies:
  games: 1
  video: 2
  general: 3

zabbix_version: 7.0
zabbix_timezone: America/Bogota
zabbix_db_password: zabbix

web_portal_title: ISP Captive Portal
web_portal_welcome: Acceso controlado para clientes PPPoE
