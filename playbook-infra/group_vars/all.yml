# Global Ansible Configuration

# Connection settings for RouterOS devices.
ansible_connection: network_cli
ansible_network_os: community.routeros.routeros
ansible_user: admin
ansible_password: admin
ansible_port: 22
ansible_command_timeout: 60

# Network prefixes used across the playbook.
core_subnet: "10.10.0.0/16"
loopback_subnet: "10.255.0.0/16"
management_subnet: "10.10.0.0/16"

# NTP target for infrastructure devices.
ntp_servers:
  - "10.10.10.9"

# SNMP defaults. These values are intentionally variable so they can be
# replaced later without touching the roles or templates.
snmp_enabled: true
snmp_version: "2c"
snmp_community: "monitoring@isp"
snmp_v3_enabled: false
snmp_v3_user: "monitoring"
snmp_v3_auth_password: "password"
snmp_v3_priv_password: "password"
snmp_v3_auth_protocol: "sha"
snmp_v3_priv_protocol: "aes"
