# Rol de configuraci�n OSPF
---
- name: Crear loopback si no existe
  community.routeros.command:
    commands:
      - /interface bridge add name=loopback
  ignore_errors: yes

- name: Asignar IP a loopback
  community.routeros.command:
    commands:
      - /ip address add address={{ loopback_network }}.{{ groups[group_names[0]].index(inventory_hostname) + 1 }}/32 interface=loopback
  ignore_errors: yes
  when: inventory_hostname in groups[group_names[0]]

- name: Habilitar OSPF instance
  community.routeros.command:
    commands:
      - /routing ospf instance add name=default router-id={{ ospf_router_id_base }}.{{ groups[group_names[0]].index(inventory_hostname) + 1 }}
  when: ospf_enabled | default(false)
  ignore_errors: yes

- name: Crear �rea OSPF backbone
  community.routeros.command:
    commands:
      - /routing ospf area add name=backbone area-id=0.0.0.0
  when: ospf_enabled | default(false)
  ignore_errors: yes

- name: Asignar interfaces a OSPF
  community.routeros.command:
    commands:
      - /routing ospf interface-template add area=backbone type=default
  when: ospf_enabled | default(false)
  ignore_errors: yes
