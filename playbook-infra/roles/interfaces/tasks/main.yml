# Rol de configuraci�n de interfaces
---
- name: Configurar hostname
  community.routeros.command:
    commands:
      - /system identity set name={{ device_name | default(inventory_hostname) }}
  when: inventory_hostname is defined

- name: Configurar velocidad y d�plex de interfaces f�sicas
  community.routeros.command:
    commands:
      - /interface ethernet set {{ item.name }} running=yes
  loop: "{{ interface_config | default([]) }}"
  when: interface_config is defined
  ignore_errors: yes

- name: Asignar IPs a interfaces
  community.routeros.command:
    commands:
      - /ip address add address={{ item.ip }}/{{ item.prefixlen }} interface={{ item.interface }}
  loop: "{{ ip_addresses | default([]) }}"
  when: ip_addresses is defined
  ignore_errors: yes

- name: Configurar cliente NTP en equipos de red
  community.routeros.command:
    commands:
      - /system ntp client set enabled=yes mode=unicast primary-ntp={{ ntp_servers[0] }} secondary-ntp={{ ntp_servers[1] | default(ntp_servers[0]) }}
  when: ntp_servers is defined and ntp_servers | length > 0
  ignore_errors: yes
